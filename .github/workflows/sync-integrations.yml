name: Atualizar ponte federada da Central

on:
  workflow_dispatch:
  schedule:
    - cron: "7,22,37,52 * * * *"
  push:
    branches:
      - main
    paths:
      - "scripts/sync-federated-status.mjs"
      - ".github/workflows/sync-integrations.yml"
      - "config/projects.json"
      - "config/integration-sources-v1.json"

permissions:
  contents: write
  actions: write

concurrency:
  group: central-federated-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Integrar fontes read-only
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Conferir Notion, comparar frescor e atualizar snapshot sanitizado
        env:
          SEEDF: ${{ secrets.SEEDF }}
          TJDFT_NOTION_TOKEN: ${{ secrets.TJDFT_NOTION_TOKEN }}
          PRF_ADM_GITHUB: ${{ secrets.PRF_ADM_GITHUB }}
          PLATAFORMA_DE_QUESTOES: ${{ secrets.PLATAFORMA_DE_QUESTOES }}
          PLANO_DE_TRANSICAO_GITHUB: ${{ secrets.PLANO_DE_TRANSICAO_GITHUB }}
        run: node scripts/sync-federated-status.mjs

      - name: Verificar diff
        run: git diff --check

      - name: Publicar somente o snapshot sanitizado quando mudar
        id: publish_snapshot
        run: |
          git add data/federated-status.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Sem mudança material nas fontes federadas."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: atualizar ponte federada da Central"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Publicar snapshot federado no GitHub Pages
        if: steps.publish_snapshot.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main --repo "$GITHUB_REPOSITORY"
