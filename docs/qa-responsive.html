<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Conferência responsiva — Central de Estudos</title>
  <style>
    *{box-sizing:border-box}body{margin:0;padding:12px;background:#071018;color:#e6eef8;font:14px/1.4 system-ui,sans-serif}
    header{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;margin:0 0 12px}h1{font-size:16px;margin:0}
    .widths{display:flex;gap:4px}button,select{min-height:40px;background:#101b2b;color:inherit;border:1px solid #34465d;border-radius:8px;padding:7px 12px;font:inherit}
    button{cursor:pointer}button[aria-pressed="true"]{border-color:#5ee0cc;color:#5ee0cc}button:focus-visible,select:focus-visible{outline:3px solid #5ee0cc;outline-offset:2px}
    label{display:flex;align-items:center;gap:8px}output{color:#a9bed2;font-size:12px}.preview{width:390px;margin:0 auto}
    iframe{display:block;width:100%;height:780px;border:0;outline:1px solid #34465d;border-radius:4px;background:#091018}
    .note{margin:14px auto 0;max-width:780px;color:#a9bed2;font-size:12px}.note a{color:#5ee0cc}
  </style>
</head>
<body>
  <header>
    <h1>Conferência responsiva</h1>
    <div class="widths" role="group" aria-label="Largura do site">
      <button type="button" data-width="320" aria-pressed="false">320 px</button>
      <button type="button" data-width="390" aria-pressed="true">390 px</button>
      <button type="button" data-width="768" aria-pressed="false">768 px</button>
      <button type="button" data-width="1363" aria-pressed="false">1363 px</button>
    </div>
    <label>Tela
      <select id="screen">
        <option value="today">Hoje</option><option value="projects">Projetos</option><option value="reviews">Revisões</option><option value="more">Mais</option><option value="mentor">Mentor</option>
      </select>
    </label>
    <button id="reload" type="button">Recarregar site</button>
    <output id="size" aria-live="polite">390 × 780 px</output>
  </header>
  <main class="preview" id="preview">
    <iframe id="central-frame" title="Central de Estudos — site publicado" src="../index.html#agora"></iframe>
  </main>
  <p class="note">A Central publicada é carregada na largura selecionada. Use a navegação dentro do site para conferir cada fluxo. A página de conferência não salva registros de estudo. <a href="../#agora">Abrir a Central</a>.</p>
  <script>
    (() => {
      "use strict";
      const frame=document.getElementById("central-frame"),preview=document.getElementById("preview"),size=document.getElementById("size"),screen=document.getElementById("screen");
      const routes={today:"../index.html#agora",projects:"../index.html#projetos",reviews:"../index.html#revisoes",more:"../index.html#mais",mentor:"../mentor/"};
      function measure(){try{size.textContent=`${frame.contentDocument.documentElement.clientWidth} × ${frame.clientHeight} px`;}catch{size.textContent="Destino externo aberto no quadro";}}
      for(const button of document.querySelectorAll("[data-width]"))button.addEventListener("click",()=>{
        const width=Number(button.dataset.width);if(![320,390,768,1363].includes(width))return;
        preview.style.width=width+"px";for(const item of document.querySelectorAll("[data-width]"))item.setAttribute("aria-pressed",String(item===button));requestAnimationFrame(measure);
      });
      frame.addEventListener("load",measure);
      screen.addEventListener("change",()=>{frame.src=routes[screen.value]||routes.today;});
      document.getElementById("reload").addEventListener("click",()=>{frame.src=routes[screen.value]||routes.today;});
    })();
  </script>
</body>
</html>
